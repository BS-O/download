<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>下载 - BS-O/download (main)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 20px; color:#111; }
    h1 { font-size:18px; margin:0 0 12px; }
    p { margin:6px 0 14px; color:#444; }
    a { color:#0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    input { padding:6px 8px; border:1px solid #ccc; border-radius:4px; width:300px; }
    #files { list-style:none; padding:0; margin:12px 0 0; max-width:900px; }
    #files li { padding:6px 8px; border-bottom:1px solid #eee; display:flex; gap:12px; align-items:center; }
    .path { flex:1; word-break:break-all; }
    .meta { color:#666; font-size:12px; min-width:80px; text-align:right; }
    .muted { color:#888; font-size:13px; margin-left:8px; }
  </style>
</head>
<body>
  <h1>下载 — BS-O/download (main)</h1>
  <p>列出 main 分支中的文件，点击文件名可下载。简单朴素的页面。</p>

  <div>
    <a id="zip" href="#" target="_blank">下载整个分支 (.zip)</a>
    <span class="muted">（也可以右键另存为）</span>
  </div>

  <ul id="files"></ul>

  <script>
    // 配置：仓库信息（已固定为你提供的仓库）
    const owner = 'BS-O';
    const repo = 'download';
    const branch = 'main';

    // GitHub API: 列出树（递归）
    const treeApi = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
    const zipUrl = `https://github.com/${owner}/${repo}/archive/refs/heads/${branch}.zip`;
    document.getElementById('zip').href = zipUrl;

    function escPath(p){
      // 对路径每个段进行编码，避免空格等问题
      return p.split('/').map(encodeURIComponent).join('/');
    }

    function niceSize(n){
      if (!n && n !== 0) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
      return (n/1024/1024).toFixed(2) + ' MB';
    }

    fetch(treeApi)
      .then(r => {
        if (!r.ok) throw new Error('无法访问 GitHub API: ' + r.status + ' ' + r.statusText);
        return r.json();
      })
      .then(data => {
        if (!data.tree) throw new Error('返回格式不符');
        const files = data.tree.filter(item => item.type === 'blob');
        const ul = document.getElementById('files');
        if (files.length === 0) {
          ul.innerHTML = '<li>未找到文件。</li>';
          return;
        }
        // 按路径排序
        files.sort((a,b)=> a.path.localeCompare(b.path));
        for (const f of files) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          const raw = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${escPath(f.path)}`;
          a.href = raw;
          a.textContent = f.path;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'path';
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = niceSize(f.size);
          li.appendChild(a);
          li.appendChild(meta);
          ul.appendChild(li);
        }
      })
      .catch(err => {
        const ul = document.getElementById('files');
        ul.innerHTML = '<li>加载失败：' + (err.message || err) + '</li>';
        console.error(err);
      });

    // 说明：如果仓库是私有的，浏览器直接请求会被拒绝（需要认证）。
    // 若需支持私有仓库，可在服务器端用带 token 的请求生成页面或使用后端代理（安全性注意）。
  </script>
</body>
</html>
